/* 时区转换：英国夏令时由 Intl 自动处理。 */
function dateKey(date=new Date(),zone=state.zone){
  const parts = new Intl.DateTimeFormat('en-CA',{
    timeZone:zone,
    year:'numeric',
    month:'2-digit',
    day:'2-digit'
  }).formatToParts(date);

  const p = Object.fromEntries(parts.map(x => [x.type,x.value]));
  return `${p.year}-${p.month}-${p.day}`;
}

function minDate(){
  return dateKey();
}

function shiftDate(n){
  const d = new Date();
  d.setDate(d.getDate()+n);
  return dateKey(d);
}

function timeUTC(day,time,zone=state.zone){
  const guess = new Date(`${day}T${time}:00Z`);

  const parts = new Intl.DateTimeFormat('en-GB',{
    timeZone:zone,
    year:'numeric',
    month:'2-digit',
    day:'2-digit',
    hour:'2-digit',
    minute:'2-digit',
    second:'2-digit',
    hourCycle:'h23'
  }).formatToParts(guess);

  const p = Object.fromEntries(parts.map(x => [x.type,x.value]));

  const asUTC = Date.UTC(
    +p.year,+p.month-1,+p.day,+p.hour,+p.minute,+p.second
  );

  return new Date(
    guess.getTime()-(asUTC-guess.getTime())
  ).toISOString();
}

function formatTime(iso){
  return new Intl.DateTimeFormat('zh-CN',{
    timeZone:state.zone,
    month:'long',
    day:'numeric',
    weekday:'short',
    hour:'2-digit',
    minute:'2-digit',
    hourCycle:'h23'

}

/* 弹窗管理 */
function showModal(html){
  lastFocus = document.activeElement;

  $('#modal-root').innerHTML = `
    <div class="modal-backdrop">
      <section class="modal" role="dialog" aria-modal="true"
        aria-label="${bookingDraft?'预约与课程操作':'平台操作'}">
        ${html}
      </section>
    </div>
  `;

  $('#modal-root').querySelectorAll('[data-close]').forEach(b=>{
    b.onclick = closeModal;
  });

  $('.modal-backdrop').onclick = e=>{
    if(e.target.classList.contains('modal-backdrop')) closeModal();
  };

  document.body.style.overflow = 'hidden';

  setTimeout(()=>{
    $('.modal button, .modal input')?.focus();
  },0);
}

function closeModal(){
  document.body.style.overflow = '';
  $('#modal-root').innerHTML = '';
  bookingDraft = null;
  lastFocus?.focus();
}

document.addEventListener('keydown',e=>{
  const modal = $('.modal');
  if(!modal) return;

  if(e.key==='Escape') closeModal();

  if(e.key==='Tab'){
    const nodes = [...modal.querySelectorAll(
      'button:not(:disabled),input:not(:disabled),select,textarea,a[href]'
    )];

    if(!nodes.length) return;

    const first = nodes[0];
    const last = nodes[nodes.length-1];

    if(e.shiftKey && document.activeElement===first){
      e.preventDefault();
      last.focus();
    }else if(!e.shiftKey && document.activeElement===last){
      e.preventDefault();
      first.focus();
    }
  }
});

/* 预约流程 */
function openBooking(id,type='talk',existingId=null){
  const t = teachers.find(t=>t.id===id);
  if(!t) return;

  const existing = existingId &&
    state.bookings.find(b=>b.id===existingId);

  bookingDraft = {
    teacherId:id,
    type:t.types.includes(type) ? type : t.types[0],
    day:existing ? dateKey(new Date(existing.start)) : shiftDate(1),
    time:null,
    existingId
  };

  drawBooking();
}

/*
 * 演示老师的开放时间：
 * 英国当地时间每天 09:00 至 16:00 开始的整点时段。
 */
function slotsForDay(day){
  const londonHours = [
    '09:00','10:00','11:00','12:00',
    '13:00','14:00','15:00','16:00'
  ];

  const result = [];

  for(const delta of [-1,0,1]){
    const date = new Date(`${day}T12:00:00Z`);
    date.setUTCDate(date.getUTCDate()+delta);
    const ukDay = date.toISOString().slice(0,10);

    for(const hour of londonHours){
      const start = timeUTC(ukDay,hour,'Europe/London');

      if(dateKey(new Date(start))===day){
        const time = new Intl.DateTimeFormat('en-GB',{
          timeZone:state.zone,
          hour:'2-digit',
          minute:'2-digit',
          hourCycle:'h23'
        }).format(new Date(start));

        result.push({time,start});
      }
    }
  }

  return result.sort((a,b)=>a.start.localeCompare(b.start));
}

/* 同一个学习账号不能同时预约重叠课程。 */
function conflict(start,draft){
  const duration = lessons[draft.type].duration*60000;

  return state.bookings.some(b=>
    b.status==='confirmed' &&
    b.id!==draft.existingId &&
    new Date(start)<new Date(b.start).getTime()+
      lessons[b.type].duration*60000 &&
    new Date(start).getTime()+duration>new Date(b.start)
  );
}

function slotAvailable(start,draft){
  return new Date(start)>new Date() && !conflict(start,draft);
}

function drawBooking(){
  const d = bookingDraft;
  const t = teachers.find(t=>t.id===d.teacherId);
  const l = lessons[d.type];
  const slots = slotsForDay(d.day);

  showModal(`
    <div class="modal-header">
      <div>
        <h2>
          ${d.existingId
            ? '给下一次对话，换个时间'
            : '一场好对话，从这里开始'}
        </h2>
        <p>
          ${d.existingId
            ? '课程类型保持不变，请选择新的上课时间。'
            : '选择你的课程和时间，剩下的就交给对话。'}
        </p>
      </div>
      <button class="close-btn" data-close aria-label="关闭预约">×</button>
    </div>

    <div class="booking-teacher">
      <img src="${t.photo}" alt="${t.name}">
      <div>
        <strong>${t.name} <span style="font-size:12px">🇬🇧</span></strong>
        <small>${t.uni}</small>
      </div>
    </div>

    <div class="field-label">01 · 选择课程</div>

    <div class="lesson-options">
      ${t.types.map(id=>`
        <button class="lesson-option ${d.type===id?'active':''}"
          data-lesson="${id}" ${d.existingId?'disabled':''}>
          <strong>${lessons[id].name}</strong>
          <span>
            £${lessons[id].price}
            <small>/ ${lessons[id].duration} 分钟</small>
          </span>
        </button>
      `).join('')}
    </div>

    <label class="field-label" for="booking-date">02 · 选择日期</label>

    <input class="date-input" type="date" id="booking-date"
      value="${d.day}" min="${minDate()}" max="${shiftDate(90)}">

    <div class="timezone-note">
      以下时间为${zoneLabel()} ·
      示例老师开放英国当地 09:00–16:00 开始的时段
    </div>

    <div class="field-label">03 · 选择时间</div>

    <div class="slots">
      ${slots.map(({time,start})=>`
        <button class="slot ${d.time===time?'active':''}"
          data-time="${time}" ${slotAvailable(start,d)?'':'disabled'}>
          ${time}
        </button>
      `).join('')}
    </div>

    <div class="booking-summary">
      <div>
        ${l.name} · ${l.duration} 分钟
        <small style="display:block;margin-top:5px;font-size:10px">
          ${d.existingId
            ? '免费改期 · 距开课至少 24 小时'
            : '含 20% 平台佣金，无额外平台服务费'}
        </small>
      </div>
      <strong>${d.existingId?'£0':`£${l.price}`}</strong>
    </div>

    <label class="micro"
      style="display:flex;align-items:start;gap:7px;margin-bottom:14px">
      <input type="checkbox" id="guardian-consent">
      我已满 18 岁，或由监护人陪同完成本次预约，并已了解下方演示规则。
    </label>

    <button class="primary full" id="confirm-booking">
      ${d.existingId
        ? '确认改期（演示）'
        : '确认预约（演示，无需支付）'}
      ${icon('arrow')}
    </button>

    <p class="micro">
      仅为前端体验，不会真实扣款。
      提前至少 24 小时可免费取消或改期；
      不足 24 小时取消不退演示金额。预约仅保存在本浏览器。
    </p>
  `);

  document.querySelectorAll('[data-lesson]').forEach(b=>{
    b.onclick = ()=>{
      d.type = b.dataset.lesson;
      d.time = null;
      drawBooking();
    };
  });

  $('#booking-date').onchange = e=>{
    if(
      !e.target.value ||
      e.target.value<minDate() ||
      e.target.value>shiftDate(90)
    ){
      toast('请选择未来 90 天内的日期');
      e.target.value = d.day;
      return;
    }

    d.day = e.target.value;
    d.time = null;
    drawBooking();
  };

  document.querySelectorAll('[data-time]').forEach(b=>{
    b.onclick = ()=>{
      d.time = b.dataset.time;

      document.querySelectorAll('[data-time]').forEach(x=>{
        x.classList.toggle('active',x===b);
      });
    };
  });

  $('#confirm-booking').onclick = confirmBooking;
}

function confirmBooking(){
  const d = bookingDraft;

  if(!d.time) return toast('请先选择一个上课时间');

  if(!$('#guardian-consent').checked){
    return toast('请先确认年龄或监护人陪同及演示规则');
  }

  const start = timeUTC(d.day,d.time);

  if(!slotAvailable(start,d)){
    toast('这个时间已不可预约，请选择其他时段');
    d.time = null;
    return drawBooking();
  }

  if(d.existingId){
    const b = state.bookings.find(x=>x.id===d.existingId);

    if(new Date(b.start)-new Date()<86400000){
      return toast('距离原定开课不足 24 小时，暂不支持改期');
    }

    b.start = start;
  }else{
    const id = globalThis.crypto?.randomUUID
      ? crypto.randomUUID()
      : `booking-${Date.now()}-${Math.random().toString(36).slice(2)}`;

    state.bookings.push({
      id,
      teacherId:d.teacherId,
      type:d.type,
      start,
      status:'confirmed',
      createdAt:new Date().toISOString()
    });
  }

  persist();

  const l = lessons[d.type];
  const t = teachers.find(x=>x.id===d.teacherId);

  showModal(`
    <div class="modal-header">
      <span></span>
      <button class="close-btn" data-close aria-label="关闭">×</button>
    </div>
    <div class="success">
      <div class="success-mark">✓</div>
      <h3>
        ${d.existingId
          ? '已换好时间，下次见！'
          : '预约好了，期待你的开口！'}
      </h3>
      <p>
        ${t.name} · ${l.name}<br>
        <strong>${formatTime(start)} · ${zoneLabel()}</strong><br>
        ${l.duration} 分钟 ·
        ${d.existingId?'改期费用 £0':`课程金额 £${l.price}`}<br>
        演示预约已保存到当前浏览器，没有真实扣款。
      </p>
      <button class="primary" id="view-courses">
        查看我的课程 ${icon('arrow')}
      </button>
    </div>
  `);

  $('#view-courses').onclick = ()=>{
    closeModal();
    navigate('courses');
  };

  render();
}

function openCancel(id){
  const b = state.bookings.find(x=>x.id===id);
  if(!b || b.status!=='confirmed') return;

  const refundable = new Date(b.start)-new Date()>=86400000;
  const l = lessons[b.type];

  showModal(`
    <div class="modal-header">
      <h2>取消这一次，期待下一次。</h2>
      <button class="close-btn" data-close aria-label="关闭">×</button>
    </div>

    <p class="subtitle" style="margin-top:18px">
      ${l.name} · ${formatTime(b.start)} · ${zoneLabel()}
    </p>

    <div class="notice">
      ${refundable
        ? '距离开课至少 24 小时，可以免费取消。'
        : '距离开课不足 24 小时，根据演示规则，本次取消不退款。'}
      <br>
      演示退款金额：<strong>£${refundable?l.price:0}</strong>。
      当前版本没有真实资金交易。
    </div>

    <div style="display:flex;gap:12px">
      <button class="secondary" data-close style="flex:1">保留预约</button>
      <button class="primary" id="confirm-cancel" style="flex:1">
        确认取消
      </button>
    </div>
  `);

  $('#confirm-cancel').onclick = ()=>{
    b.status = 'cancelled';
    b.refund = refundable ? l.price : 0;
    persist();
    closeModal();
    render();
    toast('已取消预约，可在「已取消」中查看');
  };
}
